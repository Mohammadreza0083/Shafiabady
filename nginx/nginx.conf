user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom log format including Cloudflare real IP, upstream response time, and request latency
    log_format  cloudflare  '$remote_addr ($http_cf_connecting_ip) - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                            'cf_country="$http_cf_ipcountry" cf_ray="$http_cf_ray"';

    access_log  /var/log/nginx/access.log  cloudflare;

    # Optimization directives
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Maximum file upload size
    client_max_body_size 50M;

    # Gzip Compression for modern web payloads
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2
        font/ttf
        application/vnd.ms-fontobject;

    # Include virtual host definitions
    include /etc/nginx/conf.d/*.conf;
}
